<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALERTE SÉCURITÉ</title>
<style>
:root{--bg:#1a0306;--panel:#2a0509;--red:#ff2d3d;--amber:#ffb703;--text:#ffe8ea;--ok:#35e07a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Courier New",Consolas,monospace;display:flex;align-items:center;justify-content:center;padding:16px}
body.ok{--bg:#04170c;--panel:#072a15;--red:#35e07a;--text:#e6ffee}
.box{width:100%;max-width:640px;background:var(--panel);border:2px solid var(--red);padding:22px;animation:pulse 1s infinite alternate}
body.ok .box{animation:none}
@keyframes pulse{from{box-shadow:0 0 0 0 transparent}to{box-shadow:0 0 28px 2px var(--red)}}
@media (prefers-reduced-motion:reduce){.box{animation:none}}
h1{font-size:clamp(1.3rem,5vw,1.9rem);margin:0 0 6px;color:var(--red)}
p{margin:6px 0;line-height:1.5}
.bar{height:20px;border:1px solid var(--red);margin:14px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--red)}
#log{height:190px;overflow:auto;background:#00000055;padding:10px;font-size:.85rem;border:1px solid #ffffff22}
#log div{margin:2px 0}
.warn{color:var(--amber)}
button{margin-top:14px;font:inherit;font-weight:bold;padding:10px 16px;background:var(--red);color:#000;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--text);outline-offset:2px}
#end{display:none}
body.ok #run{display:none}
body.ok #end{display:block}
</style>
</head>
<body>
<main class="box">
  <section id="run">
    <h1>⚠ VIRUS DÉTECTÉ</h1>
    <p>Un programme malveillant a pris le contrôle de cet appareil.</p>
    <div class="bar"><i id="fill"></i></div>
    <p id="pct">Analyse… 0 %</p>
    <div id="log" aria-live="polite"></div>
    <button id="stop">Annuler la suppression</button>
  </section>
  <section id="end">
    <h1>Tout va bien 😄</h1>
    <p>C'était une blague. Aucun fichier n'a été touché, aucun virus n'existe.</p>
    <p>Tu peux fermer cet onglet (Ctrl+W) ou recharger la page pour recommencer.</p>
    <button onclick="location.reload()">Rejouer</button>
  </section>
</main>
<script>
var lines=[
"Connexion au serveur du Kremlin… OK",
"Chargement du virus TrojanBaguette.exe…",
"Téléchargement de ton historique de navigation…",
"Envoi de tes photos de vacances à ta mère…",
"Suppression du dossier « Devoirs »… ",
"Suppression du dossier « Trucs importants »…",
"Remplacement de ton fond d'écran par un canard",
"Activation du mode panique…",
"Analyse de ton niveau en jeux vidéo : insuffisant",
"Formatage du disque C: dans 3… 2… 1…",
"Analyse de ta playlist : 3 morceaux honteux détectés",
"Envoi d'un SMS « je t'aime » à ton contact le plus récent…",
"Téléchargement de 47 Go de mèmes de chats",
"Vérification de ton historique de recherche… aïe",
"Contact avec le président des Pigeons : en attente",
"Réinitialisation de ton mot de passe en « 123456 »",
"Installation de 12 barres d'outils inutiles",
"Le virus se sent un peu seul, il appelle des copains…",
"Dernière vérification : es-tu bien un humain ?",
"Erreur : le virus a faim, merci de lui donner un croissant"
];
var log=document.getElementById("log"),fill=document.getElementById("fill"),pct=document.getElementById("pct");
var p=0,i=0,t;
function step(){
  p=Math.min(100,p+Math.random()*0.4+0.2);
  fill.style.width=p+"%";
  pct.textContent="Suppression en cours… "+Math.floor(p)+" %";
  if(i<lines.length&&p>=i*100/lines.length){
    var d=document.createElement("div");
    d.textContent="> "+lines[i++];
    if(i%3===0)d.className="warn";
    log.appendChild(d);log.scrollTop=log.scrollHeight;
  }
  if(p>=100){document.body.classList.add("ok");document.title="Blague !";clearInterval(t)}
}
t=setInterval(step,250);
document.getElementById("stop").onclick=function(){
  this.textContent="Trop tard 😈";p=Math.max(0,p-10);
};
document.addEventListener("keydown",function(e){
  if(e.key==="F11")return;
});
</script>
</body>
</html>
